name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build GUI EXE
      run: |
        pyinstaller --onefile --noconsole --name AutomaticOperation AutomaticOperation_GUI.py
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/AutomaticOperation.exe
        body: |
          ## 🎉 Automatic Operation Release ${{ github.ref_name }}
          
          ### 📥 Download
          - **AutomaticOperation.exe** - Giao diện GUI
          
          ### ✨ Features
          - Ghi vị trí click đơn giản (F4)
          - Tự động Copy/Paste từ WPS
          - Lặp lại workflow tự động
          - Tự động xuống dòng WPS
          - Lưu/tải cấu hình
          
          ### 🚀 How to use
          1. Download `AutomaticOperation.exe`
          2. Run (no installation needed)
          3. Click "Ghi vị trí Click" và nhấn F4 để lưu vị trí
          4. Nhập số lần lặp
          5. Click "Thực thi"
          
          ### 📚 Documentation
          - [README.md](README.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
